apiVersion: apps/v1
kind: Deployment
metadata:
  name: okms-smoke
  namespace: okms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: okms-smoke
  template:
    metadata:
      labels:
        app: okms-smoke
    spec:
      containers:
        - name: smoke
          image: <YOUR_REGISTRY>/okms-secret-fetcher:dev
          command: ["sh", "-lc"]
          env:
            - name: OKMS_REST
              value: "https://eu-west-lim.okms.ovh.net"
            - name: SECRET_UPN
              value: "<SET_PER_ENVIRONMENT>"
            - name: SECRET_KV_KEY
              value: "shared-key"
            - name: CERT_PATH
              value: "/etc/okms/tls/tls.crt"
            - name: KEY_PATH
              value: "/etc/okms/tls/tls.key"
          volumeMounts:
            - name: okms-tls
              mountPath: /etc/okms/tls
              readOnly: true
            - name: okms-script
              mountPath: /opt/kms
              readOnly: true
          args:
            - |
              set -e
              while true; do
                echo "[okms-smoke] $(date -Iseconds) fetching secret..."
                bash /opt/kms/kms-get-secret.sh \
                  --cert "$CERT_PATH" \
                  --key "$KEY_PATH" >/dev/null
                echo "[okms-smoke] secret fetch succeeded"
                sleep 60
              done
      volumes:
        - name: okms-tls
          secret:
            secretName: okms-client
        - name: okms-script
          configMap:
            name: okms-kms-script
            defaultMode: 0755
