    reason: The pinned upstream CSI controller-manager chart does not expose digest-form image configuration.
    compensating_control: The dependency archive and Chart.lock digest are committed, Renovate-managed, and reviewed before promotion.
    expires: 2026-10-31
  - finding: "helm:helm-charts/charts/rook-ceph-operator#120: container manager: securityContext.runAsNonRoot must be True"
    owner: platform-engineering
    reason: The pinned upstream CSI controller-manager requires startup identity behavior not exposed as a supported chart override.
    compensating_control: The namespace enforces the platform Pod Security profile and the dependency remains version-locked.
    expires: 2026-10-31
  - finding: "helm:helm-charts/charts/rook-ceph-operator#120: pod seccompProfile.type must be RuntimeDefault"
    owner: platform-engineering
    reason: The pinned upstream CSI controller-manager does not expose a pod-level seccomp override.
