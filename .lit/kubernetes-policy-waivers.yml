    expires: 2026-10-31
  - finding: "helm:helm-charts/charts/rook-ceph-operator#121: container rook-ceph-operator: image must use an immutable sha256 digest"
    owner: platform-engineering
    reason: The pinned upstream Rook chart accepts a version tag but does not expose a digest-form image contract.
