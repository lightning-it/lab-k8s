apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: okms-secret-fetcher-dev
  namespace: argocd
spec:
  project: lab-k8s
  source:
    repoURL: <YOUR_REPO_URL>
    targetRevision: <YOUR_TARGET_REVISION>
    path: gitops/apps/okms-secret-fetcher/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: okms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
