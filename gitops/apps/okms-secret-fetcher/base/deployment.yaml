apiVersion: apps/v1
kind: Deployment
metadata:
  name: okms-secret-fetcher-demo
  namespace: okms
  labels:
    app: okms-secret-fetcher-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: okms-secret-fetcher-demo
  template:
    metadata:
      labels:
        app: okms-secret-fetcher-demo
    spec:
      securityContext:
        fsGroup: 10001
      volumes:
        - name: okms-tls
          secret:
            secretName: okms-client
        - name: secret-out
          emptyDir: {}
      initContainers:
        - name: fetch-okms-secret
          image: example.invalid/okms-secret-fetcher:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: okms-secret-fetcher-config
          args: ["--cert", "/etc/okms/tls/tls.crt", "--key", "/etc/okms/tls/tls.key"]
          volumeMounts:
            - name: okms-tls
              mountPath: /etc/okms/tls
              readOnly: true
            - name: secret-out
              mountPath: /work
      containers:
        - name: app
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              echo "Secret file is at /work/shared-key.txt";
              ls -l /work;
              test -s /work/shared-key.txt;
              echo "Secret file is present and non-empty.";
              sleep 3600
          volumeMounts:
            - name: secret-out
              mountPath: /work
