apiVersion: batch/v1
kind: Job
metadata:
  name: okms-get-secret
  namespace: okms
spec:
  backoffLimit: 0
  template:
    spec:
      securityContext:
        fsGroup: 10001
      restartPolicy: Never
      volumes:
        - name: okms-tls
          secret:
            secretName: okms-client
        - name: secret-out
          emptyDir: {}
      containers:
        - name: fetch
          image: example.invalid/okms-secret-fetcher:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: okms-secret-fetcher-config
          args: ["--cert", "/etc/okms/tls/tls.crt", "--key", "/etc/okms/tls/tls.key"]
          volumeMounts:
            - name: okms-tls
              mountPath: /etc/okms/tls
              readOnly: true
            - name: secret-out
              mountPath: /work
